<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A real-time collaborative whiteboard." />
    <title>Realtime Canvas</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='16' height='12' rx='3' fill='%236aa9f4'/%3E%3Crect x='12' y='14' width='16' height='12' rx='3' fill='%23f28b82' opacity='.9'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas
      id="board"
      tabindex="0"
      aria-label="Shared whiteboard. The shapes on it are listed below for assistive technology."
    ></canvas>

    <div class="toolbar" role="toolbar" aria-label="Drawing tools">
      <button
        id="tool-select"
        type="button"
        title="Select and move (V)"
        aria-label="Select tool"
        aria-pressed="true"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.5L10 19z" /></svg>
      </button>
      <button
        id="tool-rectangle"
        type="button"
        title="Rectangle (R)"
        aria-label="Rectangle tool"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="12" rx="2.5" /></svg>
      </button>
      <span class="separator" aria-hidden="true"></span>
      <div class="swatches" role="group" aria-label="Colour">
        <button
          class="swatch"
          type="button"
          data-color="#f28b82"
          aria-label="Coral"
          aria-pressed="false"
          style="--swatch: #f28b82"
        ></button>
        <button
          class="swatch"
          type="button"
          data-color="#fbbc59"
          aria-label="Amber"
          aria-pressed="false"
          style="--swatch: #fbbc59"
        ></button>
        <button
          class="swatch"
          type="button"
          data-color="#6fcf97"
          aria-label="Green"
          aria-pressed="false"
          style="--swatch: #6fcf97"
        ></button>
        <button
          class="swatch"
          type="button"
          data-color="#6aa9f4"
          aria-label="Blue"
          aria-pressed="true"
          style="--swatch: #6aa9f4"
        ></button>
        <button
          class="swatch"
          type="button"
          data-color="#b39ddb"
          aria-label="Lavender"
          aria-pressed="false"
          style="--swatch: #b39ddb"
        ></button>
      </div>
      <span class="separator" aria-hidden="true"></span>
      <button id="delete" type="button" title="Delete (Del)" aria-label="Delete selected shape" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" /></svg>
      </button>
    </div>

    <div class="panel">
      <span id="status" class="status" data-status="idle" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Starting…</span>
      </span>
      <span id="pending" class="pending" data-count="0" hidden></span>
      <ul id="presence" class="presence" aria-label="People in this room" data-count="0"></ul>
      <button id="copy-link" type="button">Copy link</button>
    </div>

    <p class="hint">R draws a rectangle · V selects · Delete removes · share the link to collaborate</p>

    <ul id="shape-list" class="sr-only" aria-label="Shapes on the board" data-count="0"></ul>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
