# Fly.io configuration for the WebSocket server.
#
# Change `app` to a name no one else has taken, and `primary_region` to the
# region closest to your users (`fly platform regions` lists them; bom is Mumbai).
#
# One machine and one volume on purpose: room state is cached in this process and
# the op log is a local SQLite file, so a second machine would have its own,
# different copy of every room. See docs/deployment.md, "Why one machine".

app = "realtime-canvas-server"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/ops.sqlite"
  # Room ids from the web app are 128 random bits; refuse short guessable ones like "demo".
  MIN_ROOM_ID_LENGTH = "16"
  # ALLOWED_ORIGINS is not set here: it is your web app's address, which you only know
  # after the first Vercel deploy. Set it with:  fly secrets set ALLOWED_ORIGINS=https://your-app.vercel.app
  # The server refuses to start in production without it, on purpose.

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Stopping an idle machine would drop every open WebSocket and empty the room cache.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
