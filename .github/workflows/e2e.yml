name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Real browsers against the real server. Kept apart from CI so the fast
# checks (lint, types, unit tests) report first and are not held up by it.
jobs:
  e2e:
    # Pinned, not `ubuntu-latest`: GitHub moved that label to a newer Ubuntu than this
    # Playwright version supports, which broke the browser install. Move both together.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tests start the built server bundle, so build everything first.
      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: client

      - name: End-to-end tests
        run: npm run e2e -w client

      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7
